<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Trading Scanner</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  background: #071019;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 750px;
  margin: auto;
}

.header {
  text-align: center;
  margin-bottom: 20px;
}

.header h1 {
  color: #38bdf8;
  font-size: 32px;
  margin-bottom: 8px;
}

.header p {
  color: #94a3b8;
  font-size: 16px;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 15px;
}

select,
button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
}

select {
  background: #172333;
  color: white;
}

button {
  background: #0ea5e9;
  color: white;
  font-weight: bold;
}

button:active {
  transform: scale(.98);
}

.card {
  background: #101c2b;
  border: 1px solid #243447;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 15px;
}

.price {
  text-align: center;
  font-size: 34px;
  font-weight: bold;
  margin: 8px 0;
}

.change {
  text-align: center;
  color: #94a3b8;
  margin-bottom: 15px;
}

.signal {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  padding: 20px;
  border-radius: 14px;
  margin: 15px 0;
}

.buy {
  background: #064e3b;
  color: #34d399;
}

.sell {
  background: #7f1d1d;
  color: #f87171;
}

.hold {
  background: #78350f;
  color: #fbbf24;
}

.strength {
  text-align: center;
  font-size: 18px;
  margin: 12px 0;
}

.bar {
  height: 10px;
  background: #243447;
  border-radius: 10px;
  overflow: hidden;
}

.barFill {
  height: 100%;
  width: 0%;
  background: #38bdf8;
  transition: width .5s;
}

.chartBox {
  width: 100%;
  height: 260px;
  position: relative;
}

canvas {
  width: 100%;
  height: 100%;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 15px;
}

.stat {
  background: #172333;
  padding: 15px;
  border-radius: 12px;
}

.label {
  color: #94a3b8;
  font-size: 13px;
}

.value {
  margin-top: 6px;
  font-size: 18px;
  font-weight: bold;
}

.analysis {
  text-align: center;
  color: #cbd5e1;
  line-height: 1.5;
  margin-top: 18px;
}

.status {
  text-align: center;
  color: #64748b;
  font-size: 13px;
}

@media(max-width:500px) {

  body {
    padding: 12px;
  }

  .header h1 {
    font-size: 28px;
  }

  .price {
    font-size: 28px;
  }

  .signal {
    font-size: 26px;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🤖 AI Trading Scanner</h1>
<p>Live Cryptocurrency Market Analysis</p>
</div>

<div class="controls">

<select id="symbol">
<option value="BTCUSDT">BTC / USDT</option>
<option value="ETHUSDT">ETH / USDT</option>
<option value="BNBUSDT">BNB / USDT</option>
<option value="SOLUSDT">SOL / USDT</option>
<option value="XRPUSDT">XRP / USDT</option>
</select>

<select id="interval">
<option value="15m">15 Minutes</option>
<option value="1h" selected>1 Hour</option>
<option value="4h">4 Hours</option>
</select>

</div>

<button onclick="scanMarket()">🔍 SCAN MARKET</button>

<div class="card">

<div id="price" class="price">
Loading...
</div>

<div id="change" class="change">
Loading market...
</div>

<div id="signal" class="signal hold">
WAITING
</div>

<div class="strength">
Signal Strength:
<strong id="strength">0%</strong>
</div>

<div class="bar">
<div id="barFill" class="barFill"></div>
</div>

</div>

<div class="card">

<h3>📈 Price Chart</h3>

<div class="chartBox">
<canvas id="chart"></canvas>
</div>

</div>

<div class="card">

<div class="stats">

<div class="stat">
<div class="label">RSI</div>
<div id="rsi" class="value">-</div>
</div>

<div class="stat">
<div class="label">EMA 20</div>
<div id="ema20" class="value">-</div>
</div>

<div class="stat">
<div class="label">EMA 50</div>
<div id="ema50" class="value">-</div>
</div>

<div class="stat">
<div class="label">MACD</div>
<div id="macd" class="value">-</div>
</div>

</div>

<p id="analysis" class="analysis">
Press SCAN MARKET to analyze.
</p>

<p class="status">
Last update: <span id="updated">-</span>
</p>

<p class="status">
⚠️ Analysis only. Signals are not guaranteed.
</p>

</div>

</div>

<script>

const API =
"https://api.binance.com/api/v3/klines";

async function getData(symbol, interval) {

const url =
API +
"?symbol=" +
symbol +
"&interval=" +
interval +
"&limit=100";

const response =
await fetch(url);

if (!response.ok) {
throw new Error("Market data unavailable");
}

return await response.json();
}

function ema(values, period) {

const multiplier =
2 / (period + 1);

let result =
values[0];

for(let i = 1; i < values.length; i++) {

result =
(values[i] - result) *
multiplier + result;

}

return result;
}

function calculateRSI(values, period=14) {

let gains = 0;
let losses = 0;

for(let i=1; i<=period; i++) {

const change =
values[i] - values[i-1];

if(change >= 0)
gains += change;
else
losses += Math.abs(change);

}

let avgGain =
gains / period;

let avgLoss =
losses / period;

for(let i=period+1; i<values.length; i++) {

const change =
values[i] - values[i-1];

const gain =
change > 0 ? change : 0;

const loss =
change < 0 ? Math.abs(change) : 0;

avgGain =
((avgGain*(period-1))+gain)/period;

avgLoss =
((avgLoss*(period-1))+loss)/period;

}

if(avgLoss === 0)
return 100;

const rs =
avgGain / avgLoss;

return 100 - (100/(1+rs));
}

function drawChart(values) {

const canvas =
document.getElementById("chart");

const ctx =
canvas.getContext("2d");

const width =
canvas.clientWidth;

const height =
canvas.clientHeight;

canvas.width =
width * devicePixelRatio;

canvas.height =
height * devicePixelRatio;

ctx.scale(
devicePixelRatio,
devicePixelRatio
);

ctx.clearRect(0,0,width,height);

const min =
Math.min(...values);

const max =
Math.max(...values);

const range =
max-min || 1;

ctx.beginPath();

values.forEach((value,index)=>{

const x =
(index/(values.length-1))*width;

const y =
height -
((value-min)/range)*height;

if(index===0)
ctx.moveTo(x,y);
else
ctx.lineTo(x,y);

});

ctx.strokeStyle =
"#38bdf8";

ctx.lineWidth = 2;

ctx.stroke();
}

async function scanMarket() {

const symbol =
document.getElementById("symbol").value;

const interval =
document.getElementById("interval").value;

const signal =
document.getElementById("signal");

const analysis =
document.getElementById("analysis");

signal.className =
"signal hold";

signal.textContent =
"SCANNING...";

try {

const data =
await getData(symbol,interval);

const closes =
data.map(c =>
parseFloat(c[4])
);

const firstPrice =
closes[0];

const price =
closes[closes.length-1];

const ema20 =
ema(closes,20);

const ema50 =
ema(closes,50);

const rsi =
calculateRSI(closes,14);

const fastEMA =
ema(closes,12);

const slowEMA =
ema(closes,26);

const macd =
fastEMA-slowEMA;

const change =
((price-firstPrice)/
firstPrice)*100;

document.getElementById("price")
.textContent =
price.toFixed(4)+" USDT";

document.getElementById("change")
.textContent =
"Period change: "+
change.toFixed(2)+"%";

document.getElementById("rsi")
.textContent =
rsi.toFixed(2);

document.getElementById("ema20")
.textContent =
ema20.toFixed(4);

document.getElementById("ema50")
.textContent =
ema50.toFixed(4);

document.getElementById("macd")
.textContent =
macd.toFixed(4);

drawChart(closes);

let score = 0;

if(price > ema20)
score++;

else
score--;

if(ema20 > ema50)
score++;

else
score--;

if(rsi > 55 && rsi < 70)
score++;

else if(rsi < 45 && rsi > 30)
score--;

if(macd > 0)
score++;

else
score--;

let strength =
Math.round(
(Math.abs(score)/4)*100
);

if(score >= 2) {

signal.className =
"signal buy";

signal.textContent =
"🟢 BUY";

analysis.textContent =
"Bullish conditions detected. "+
"Price is showing positive momentum.";

}

else if(score <= -2) {

signal.className =
"signal sell";

signal.textContent =
"🔴 SELL";

analysis.textContent =
"Bearish conditions detected. "+
"Price is showing downward momentum.";

}

else {

signal.className =
"signal hold";

signal.textContent =
"🟡 HOLD";

analysis.textContent =
"Market conditions are mixed. "+
"Wait for stronger confirmation.";

}

document.getElementById("strength")
.textContent =
strength+"%";

document.getElementById("barFill")
.style.width =
strength+"%";

document.getElementById("updated")
.textContent =
new Date().toLocaleTimeString();

}

catch(error) {

signal.className =
"signal hold";

signal.textContent =
"ERROR";

analysis.textContent =
"Unable to load market data. "+
"Please try again.";

}

}

scanMarket();

setInterval(
scanMarket,
60000
);

</script>

</body>
</html>
