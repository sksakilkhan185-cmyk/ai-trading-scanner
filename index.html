<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Market Scanner</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#071019;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

/* Floating scanner button */
#scanBtn{
  position:fixed;
  left:calc(100vw - 105px);
  top:calc(100vh - 75px);
  z-index:9999;

  border:0;
  border-radius:50px;
  padding:13px 20px;

  background:#0797df;
  color:white;
  font-size:15px;
  font-weight:bold;

  box-shadow:0 6px 22px #000b;
  cursor:grab;
  touch-action:none;
  user-select:none;
}

#scanBtn:active{
  cursor:grabbing;
}

/* Scanner panel */
#panel{
  display:none;
  position:fixed;
  z-index:9998;

  width:315px;
  max-width:calc(100vw - 20px);

  padding:16px;

  background:#111e2d;
  border:1px solid #2b4055;
  border-radius:18px;

  box-shadow:0 10px 35px #000b;
}

select{
  width:100%;
  padding:11px;
  margin-bottom:9px;

  border:0;
  border-radius:10px;

  background:#1b2b3d;
  color:white;
  font-size:15px;
}

#marketStatus{
  text-align:center;
  color:#9fb0c2;
  font-size:12px;
  margin:3px 0 10px;
}

.price{
  text-align:center;
  font-size:25px;
  font-weight:bold;
  margin:8px 0 12px;
}

.signal{
  text-align:center;
  font-size:25px;
  font-weight:bold;
  padding:13px;
  margin-bottom:10px;
  border-radius:12px;
}

.buy{
  background:#087d4d;
}

.sell{
  background:#982020;
}

.wait{
  background:#675818;
}

.percent{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
}

.box{
  background:#18283a;
  padding:9px 3px;
  text-align:center;
  border-radius:10px;
  color:#9fb0c2;
  font-size:12px;
}

.box b{
  display:block;
  color:white;
  font-size:18px;
  margin-top:4px;
}

.info{
  text-align:center;
  color:#9eafc3;
  font-size:13px;
  margin-top:10px;
}

.follow{
  color:#43e698;
  font-weight:bold;
}

#status{
  text-align:center;
  color:#8195aa;
  font-size:11px;
  margin-top:9px;
  line-height:1.4;
}

#reset{
  width:100%;
  margin-top:10px;
  padding:8px;

  border:0;
  border-radius:8px;

  background:#26394c;
  color:#b8c8d8;
}
</style>
</head>

<body>

<!-- Scanner panel -->
<div id="panel">

  <!-- Market type -->
  <select id="marketType">
    <option value="crypto">Crypto — Binance</option>
    <option value="forex">Forex — Data source required</option>
    <option value="stock">Stock — Data source required</option>
    <option value="binary">Binary / OTC — Broker feed required</option>
  </select>

  <!-- Crypto symbol -->
  <select id="symbol">
    <option value="BTCUSDT">BTC / USDT</option>
    <option value="ETHUSDT">ETH / USDT</option>
    <option value="BNBUSDT">BNB / USDT</option>
    <option value="SOLUSDT">SOL / USDT</option>
    <option value="XRPUSDT">XRP / USDT</option>
    <option value="DOGEUSDT">DOGE / USDT</option>
    <option value="ADAUSDT">ADA / USDT</option>
    <option value="AVAXUSDT">AVAX / USDT</option>
    <option value="LINKUSDT">LINK / USDT</option>
    <option value="TRXUSDT">TRX / USDT</option>
  </select>

  <!-- Timeframe -->
  <select id="timeframe">
    <option value="1m">1 Minute</option>
    <option value="2m">2 Minutes</option>
    <option value="5m">5 Minutes</option>
    <option value="15m">15 Minutes</option>
  </select>

  <div id="marketStatus">
    ● Ready
  </div>

  <div id="price" class="price">
    --
  </div>

  <div id="signal" class="signal wait">
    NO TRADE
  </div>

  <div class="percent">

    <div class="box">
      BUY
      <b id="buy">--%</b>
    </div>

    <div class="box">
      SELL
      <b id="sell">--%</b>
    </div>

    <div class="box">
      WAIT
      <b id="wait">--%</b>
    </div>

  </div>

  <div class="info">
    Signal Confidence:
    <b id="confidence">--%</b>
  </div>

  <div class="info">
    Market Following:
    <span class="follow">● ON</span>
  </div>

  <div id="status">
    Select a market and press SCAN.
  </div>

  <button id="reset">
    Reset Button Position
  </button>

</div>

<!-- Floating button -->
<button id="scanBtn">
  ⚡ SCAN
</button>


<script>

/* =====================================================
   GLOBALS
===================================================== */

const scanBtn = document.getElementById("scanBtn");
const panel = document.getElementById("panel");

const marketType =
  document.getElementById("marketType");

const symbol =
  document.getElementById("symbol");

const timeframe =
  document.getElementById("timeframe");

let refreshTimer = null;


/* =====================================================
   OPEN / CLOSE PANEL
===================================================== */

scanBtn.addEventListener("click", function(){

  if(panel.style.display === "block"){

    panel.style.display = "none";

    if(refreshTimer){
      clearInterval(refreshTimer);
      refreshTimer = null;
    }

    return;
  }

  panel.style.display = "block";

  placePanel();

  scanMarket();

  /*
    Follow live market every 15 seconds.
  */
  refreshTimer =
    setInterval(scanMarket,15000);

});


/* =====================================================
   PANEL POSITION
===================================================== */

function placePanel(){

  const r =
    scanBtn.getBoundingClientRect();

  let left = r.left;
  let top = r.top - 350;

  if(top < 10){
    top = r.bottom + 10;
  }

  if(left + 315 > window.innerWidth){
    left = window.innerWidth - 325;
  }

  if(left < 10){
    left = 10;
  }

  if(top + 350 > window.innerHeight){
    top = window.innerHeight - 360;
  }

  if(top < 10){
    top = 10;
  }

  panel.style.left = left + "px";
  panel.style.top = top + "px";
}


/* =====================================================
   MARKET TYPE
===================================================== */

marketType.addEventListener("change", function(){

  const type = marketType.value;

  if(type !== "crypto"){

    document.getElementById("marketStatus")
      .textContent =
      "⚠ Live feed/API required for this market.";

    document.getElementById("signal")
      .className = "signal wait";

    document.getElementById("signal")
      .textContent = "NO LIVE DATA";

    document.getElementById("buy")
      .textContent = "--%";

    document.getElementById("sell")
      .textContent = "--%";

    document.getElementById("wait")
      .textContent = "--%";

    document.getElementById("confidence")
      .textContent = "--%";

    document.getElementById("price")
      .textContent = "--";

    document.getElementById("status")
      .textContent =
      "Connect an authorised live data feed for this market.";

    return;
  }

  scanMarket();

});


symbol.addEventListener(
  "change",
  scanMarket
);

timeframe.addEventListener(
  "change",
  scanMarket
);


/* =====================================================
   GET BINANCE DATA
===================================================== */

async function getCryptoData(){

  const selectedSymbol =
    symbol.value;

  const selectedTimeframe =
    timeframe.value;

  /*
    Binance has native:
    1m, 5m, 15m.

    2m is constructed from 1m candles.
  */

  let apiInterval =
    selectedTimeframe;

  if(selectedTimeframe === "2m"){
    apiInterval = "1m";
  }

  const url =
    "https://api.binance.com/api/v3/klines" +
    "?symbol=" + selectedSymbol +
    "&interval=" + apiInterval +
    "&limit=120";

  const response =
    await fetch(url);

  if(!response.ok){
    throw new Error("Binance data unavailable");
  }

  const data =
    await response.json();


  /*
    Combine 1-minute candles
    into 2-minute candles.
  */

  if(selectedTimeframe === "2m"){

    const combined = [];

    for(
      let i=0;
      i<data.length-1;
      i+=2
    ){

      const a = data[i];
      const b = data[i+1];

      if(!b) break;

      combined.push([
        a[0],
        a[1],

        Math.max(
          Number(a[2]),
          Number(b[2])
        ),

        Math.min(
          Number(a[3]),
          Number(b[3])
        ),

        b[4]
      ]);
    }

    return combined;
  }

  return data;
}


/* =====================================================
   EMA
===================================================== */

function EMA(values, period){

  if(values.length < period){
    return values[values.length-1];
  }

  const k =
    2/(period+1);

  let value =
    values[0];

  for(
    let i=1;
    i<values.length;
    i++
  ){

    value =
      values[i]*k +
      value*(1-k);
  }

  return value;
}


/* =====================================================
   RSI
===================================================== */

function RSI(values, period=14){

  if(values.length <= period){
    return 50;
  }

  let gains = 0;
  let losses = 0;

  for(
    let i=values.length-period;
    i<values.length;
    i++
  ){

    const change =
      values[i]-values[i-1];

    if(change > 0){
      gains += change;
    }else{
      losses += Math.abs(change);
    }
  }

  if(losses === 0){
    return 100;
  }

  const rs =
    gains/losses;

  return 100-(100/(1+rs));
}


/* =====================================================
   SCAN MARKET
===================================================== */

async function scanMarket(){

  /*
    Non-crypto markets don't have a
    real feed in this version.
  */

  if(marketType.value !== "crypto"){
    return;
  }

  document.getElementById("marketStatus")
    .textContent =
    "● Live Binance feed";

  document.getElementById("status")
    .textContent =
    "Analysing live market...";

  try{

    const data =
      await getCryptoData();

    const closes =
      data.map(
        candle => Number(candle[4])
      );

    if(closes.length < 30){
      throw new Error("Insufficient candles");
    }


    /* Current price */

    const price =
      closes[closes.length-1];


    /* Indicators */

    const rsi =
      RSI(closes,14);

    const ema20 =
      EMA(closes,20);

    const ema50 =
      EMA(closes,50);


    /* MACD */

    const recent =
      closes.slice(-50);

    const ema12 =
      EMA(recent,12);

    const ema26 =
      EMA(recent,26);

    const macd =
      ema12-ema26;


    /* =================================================
       SCORE
    ================================================= */

    let score = 50;


    /* RSI */

    if(rsi < 30){

      score += 15;

    }else if(rsi < 45){

      score += 5;

    }else if(rsi > 70){

      score -= 15;

    }else if(rsi > 55){

      score -= 5;

    }


    /* EMA 20 */

    if(price > ema20){
      score += 10;
    }else{
      score -= 10;
    }


    /* EMA 50 */

    if(ema20 > ema50){
      score += 10;
    }else{
      score -= 10;
    }


    /* MACD */

    if(macd > 0){
      score += 10;
    }else{
      score -= 10;
    }


    score =
      Math.max(
        5,
        Math.min(95,score)
      );


    /* =================================================
       SIGNAL
    ================================================= */

    let buy;
    let sell;
    let wait;
    let signal;


    if(score >= 60){

      buy = score;

      sell =
        Math.round(
          (100-score)*0.55
        );

      wait =
        100-buy-sell;

      signal = "🟢 BUY";

    }else if(score <= 40){

      sell =
        100-score;

      buy =
        Math.round(
          score*0.55
        );

      wait =
        100-buy-sell;

      signal = "🔴 SELL";

    }else{

      wait = 55;

      buy =
        Math.round(
          (100-wait)*score/100
        );

      sell =
        100-wait-buy;

      signal = "🟡 NO TRADE";
    }


    /* =================================================
       DISPLAY
    ================================================= */

    document.getElementById("price")
      .textContent =
      Number(price).toLocaleString(
        undefined,
        {
          minimumFractionDigits:2,
          maximumFractionDigits:6
        }
      ) + " USDT";


    document.getElementById("buy")
      .textContent =
      buy + "%";


    document.getElementById("sell")
      .textContent =
      sell + "%";


    document.getElementById("wait")
      .textContent =
      wait + "%";


    document.getElementById("confidence")
      .textContent =
      Math.max(
        buy,
        sell,
        wait
      ) + "%";


    const signalBox =
      document.getElementById("signal");

    signalBox.textContent =
      signal;

    signalBox.className =
      "signal";


    if(signal.includes("BUY")){

      signalBox.classList.add("buy");

    }else if(signal.includes("SELL")){

      signalBox.classList.add("sell");

    }else{

      signalBox.classList.add("wait");

    }


    document.getElementById("status")
      .textContent =
      "Live • " +
      new Date().toLocaleTimeString();

  }catch(error){

    document.getElementById("marketStatus")
      .textContent =
      "● Data connection problem";

    document.getElementById("status")
      .textContent =
      "Unable to load live market data.";

  }
}


/* =====================================================
   DRAG BUTTON
===================================================== */

let dragging = false;
let moved = false;

let offsetX = 0;
let offsetY = 0;


/* Touch start */

scanBtn.addEventListener(
  "touchstart",
  function(e){

    const t =
      e.touches[0];

    const r =
      scanBtn.getBoundingClientRect();

    offsetX =
      t.clientX-r.left;

    offsetY =
      t.clientY-r.top;

    dragging = true;
    moved = false;

  },
  {passive:true}
);


/* Touch move */

scanBtn.addEventListener(
  "touchmove",
  function(e){

    if(!dragging) return;

    const t =
      e.touches[0];

    let x =
      t.clientX-offsetX;

    let y =
      t.clientY-offsetY;


    x =
      Math.max(
        5,
        Math.min(
          window.innerWidth-
          scanBtn.offsetWidth-
          5,
          x
        )
      );


    y =
      Math.max(
        5,
        Math.min(
          window.innerHeight-
          scanBtn.offsetHeight-
          5,
          y
        )
      );


    scanBtn.style.left =
      x+"px";

    scanBtn.style.top =
      y+"px";

    moved = true;

    e.preventDefault();

  },
  {passive:false}
);


/* Touch end */

scanBtn.addEventListener(
  "touchend",
  function(){

    if(dragging && moved){

      localStorage.setItem(
        "scannerLeft",
        scanBtn.style.left
      );

      localStorage.setItem(
        "scannerTop",
        scanBtn.style.top
      );
    }

    dragging = false;
  }
);


/* =====================================================
   MOUSE DRAG
===================================================== */

scanBtn.addEventListener(
  "mousedown",
  function(e){

    const r =
      scanBtn.getBoundingClientRect();

    offsetX =
      e.clientX-r.left;

    offsetY =
      e.clientY-r.top;

    dragging = true;
    moved = false;

  }
);


document.addEventListener(
  "mousemove",
  function(e){

    if(!dragging) return;

    let x =
      e.clientX-offsetX;

    let y =
      e.clientY-offsetY;


    x =
      Math.max(
        5,
        Math.min(
          window.innerWidth-
          scanBtn.offsetWidth-
          5,
          x
        )
      );


    y =
      Math.max(
        5,
        Math.min(
          window.innerHeight-
          scanBtn.offsetHeight-
          5,
          y
        )
      );


    scanBtn.style.left =
      x+"px";

    scanBtn.style.top =
      y+"px";

    moved = true;
  }
);


document.addEventListener(
  "mouseup",
  function(){

    if(dragging && moved){

      localStorage.setItem(
        "scannerLeft",
        scanBtn.style.left
      );

      localStorage.setItem(
        "scannerTop",
        scanBtn.style.top
      );
    }

    dragging = false;
  }
);


/* =====================================================
   LOAD SAVED POSITION
===================================================== */

const savedLeft =
  localStorage.getItem(
    "scannerLeft"
  );

const savedTop =
  localStorage.getItem(
    "scannerTop"
  );

if(savedLeft && savedTop){

  scanBtn.style.left =
    savedLeft;

  scanBtn.style.top =
    savedTop;
}


/* =====================================================
   RESET POSITION
===================================================== */

document.getElementById(
  "reset"
).addEventListener(
  "click",
  function(){

    scanBtn.style.left =
      "calc(100vw - 105px)";

    scanBtn.style.top =
      "calc(100vh - 75px)";

    localStorage.removeItem(
      "scannerLeft"
    );

    localStorage.removeItem(
      "scannerTop"
    );
  }
);


/* =====================================================
   KEEP BUTTON ON SCREEN
===================================================== */

window.addEventListener(
  "resize",
  function(){

    const r =
      scanBtn.getBoundingClientRect();

    let x =
      Math.max(
        5,
        Math.min(
          r.left,
          window.innerWidth-
          scanBtn.offsetWidth-
          5
        )
      );

    let y =
      Math.max(
        5,
        Math.min(
          r.top,
          window.innerHeight-
          scanBtn.offsetHeight-
          5
        )
      );

    scanBtn.style.left =
      x+"px";

    scanBtn.style.top =
      y+"px";
  }
);

</script>

</body>
</html>
